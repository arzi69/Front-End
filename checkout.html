    <!--Cart & Checkout HTML Process Starting From here-->
    <body class="checkout-page">
        <section class="container my-5 text-white">
            <h2 class="text-center text-white">Your Cart</h2>
            <div id="cart-items" class="mb-3 text-black"></div>
            <h3>Total: <span id="total-price">$0</span></h3>
            
            <!-- Customer Information Section -->
            <div class="card p-4 my-4 text-white">
                <h3>Enter your details</h3>
                <form id="customer-form text-white">
                    <div class="mb-3 text-white">
                        <label for="email" class="form-label">Email Address: <span class="text-danger">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3 text-white">
                        <label for="phone" class="form-label">Phone Number: <span class="text-danger">*</span></label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
                    </div>
                    <div class="mb-3 text-white">
                        <label for="address" class="form-label">Address: <span class="text-danger">*</span></label>
                        <input type="text" id="address" name="address" class="form-control" placeholder="Enter your address" required>
                    </div>
                    <div class="mb-3 text-white">
                        <label for="postcode" class="form-label">Post Code: <span class="text-danger">*</span></label>
                        <input type="number & text" id="postcode" name="postcode" class="form-control" placeholder="Enter your post code" required>
                    </div>
                </form>
            </div>
    
            <div class="payment-method">
                <h3>Choose Payment Method</h3>
                <div class="payment-options">
                    <label>
                        <input type="radio" id="credit-card" name="payment" value="credit-card" checked> Credit Card
                    </label>
                    <label>
                        <input type="radio" id="paypal" name="payment" value="paypal"> PayPal
                    </label>
                </div>
            
                <!-- Credit Card Fields -->
                <div id="credit-card-fields" class="payment-details">
                    <div class="form-group">
                        <label for="card-number">Card Number: <span class="text-danger">*</span></label>
                        <input type="text" id="card-number" name="card-number" placeholder="Enter your card number" required>
                    </div>
                    <div class="form-group">
                        <label for="exp-date">Expiration Date: <span class="text-danger">*</span></label>
                        <input type="month" id="exp-date" name="exp-date" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV: <span class="text-danger">*</span></label>
                        <input type="text" id="cvv" name="cvv" placeholder="Enter your CVV" required>
                    </div>
                </div>
            
                <!-- PayPal Fields -->
                <div id="paypal-fields" class="payment-details">
                    <div class="form-group">
                        <label for="paypal-email">PayPal Email: <span class="text-danger">*</span></label>
                        <input type="email" id="paypal-email" name="paypal-email" placeholder="Enter your PayPal email" required>
                    </div>
                </div>
            </div>
            
    
            <button id="checkout-btn" class="btn btn-primary w-100 mt-3">Proceed to Payment</button>
        </section>
