<body>
 <!-- Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-black">

    <!--Contact Content Section-->
    <div class="container py-5 text-white">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center mb-4">Contact Us</h1>
                <p class="text-center">Have any questions? Fill out the form below and we will get back to you.</p>
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name: <span class="text-danger">*</span></label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email: <span class="text-danger">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message: <span class="text-danger">*</span></label>
                        <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn-custom fw-bold">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

    <!--Footer Section-->
    <footer>
        <div class="logo">
            <img src="./images/LOGO.png" alt="EL Nurado" style="max-width: 120px;">
        </div>
        
        <div class="contact text-end">
            <h3>Contact Us</h3>
            <p><i class="fas fa-envelope"></i> elnuradoplus@gmail.com</p>
            <p><i class="fas fa-phone"></i> +44 7674550825</p>

        </div>

            <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
        </div>
    
        <div class="copyright text-center mt-2">© 2025 EL Nurado+</div>
    </footer>

        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault(); 
            window.location.href = "thankyou.html";
        });
    </script>
